<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Journal · Doon Dekho</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121418'/%3E%3Ctext x='32' y='45' font-family='Arial,sans-serif' font-size='38' font-weight='800' text-anchor='middle' fill='%23C9A86A'%3ED%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#0E1013">
<meta property="og:site_name" content="Doon Dekho">
<meta property="og:type" content="website">
<meta property="og:title" content="Doon Dekho · The complete guide to Dehradun">
<meta property="og:description" content="Cafés, street food, hidden gems, schools, shops and stories from the Doon Valley.">
<meta property="og:image" content="https://images.unsplash.com/photo-1660791601899-f79f14cc427d?auto=format&fit=crop&w=1200&h=630&q=80">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://images.unsplash.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="post">
<div class="progress" aria-hidden="true"></div>
<header id="nav"></header>

<main>
  <section class="article-hero" id="ahero"></section>
  <div class="wrap">
    <div class="article">
      <aside class="toc" id="toc" aria-label="In this story"></aside>
      <article>
        <div class="body" id="abody"></div>
        <div class="author"><div class="av">D</div><div><b>Doon Dekho</b><span>Written and photographed in Dehradun</span></div></div>
      </article>
      <aside class="aside-card" id="aside"></aside>
    </div>
    <a class="next-read" id="nextRead"></a>

    <section class="sec rv" style="padding-top:100px">
      <div class="sec-head"><div><p class="label">Keep reading</p><h2>More from <em>the Journal</em></h2></div><a class="link-more" href="blog.html">All stories</a></div>
      <div class="slider s-3" id="more"></div>
    </section>
  </div>
</main>
<footer id="footer"></footer>

<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script>
(function(){
const {$,$$,ph,phIn,hue,esc,sliderControls,splitWords,playSplit,toast}=Doon;
const slug=new URLSearchParams(location.search).get("p")||location.hash.slice(1);
const idx=Math.max(0,POSTS.findIndex(p=>p.slug===slug));
const P=POSTS[idx];
document.title=`${P.t} · Doon Dekho`;

$("#ahero").style.setProperty("--h",hue(P.img));
$("#ahero").innerHTML=`${ph(P.img,2000,P.t,"",true)}<div class="wrap"><p class="crumbs"><a href="index.html">Home</a><span>/</span><a href="blog.html">Journal</a><span>/</span><span>${P.cat}</span></p>
 <h1 id="atitle">${P.t}</h1><p class="dek">${P.ex}</p><p class="meta" style="margin-top:22px"><span class="cat">${P.cat}</span><span>·</span><span>${P.min} min read</span><span>·</span><span>${P.date}</span></p></div>`;
addEventListener("scroll",()=>{const y=scrollY;if(y<innerHeight){const p=$("#ahero .ph");if(p)p.style.transform=`translateY(${y*.35}px)`}},{passive:true});

let hn=0;const heads=[];
const blocks=P.body.map(b=>{
  if(b.h){const id="s"+(++hn);heads.push([id,b.h]);return `<h2 id="${id}">${b.h}</h2>`}
  if(b.q)return `<blockquote>${b.q}</blockquote>`;
  if(b.tip)return `<p class="tip"><b>Local tip ·</b> ${b.tip}</p>`;
  if(b.img)return `<figure class="figure clip">${ph(b.img,1400,b.cap)}<figcaption>${b.cap}</figcaption></figure>`;
  return `<p>${b.p}</p>`});
if(blocks.length>4)blocks.splice(3,0,Doon.ad("article"));
$("#abody").innerHTML=blocks.join("");
$("#toc").innerHTML=heads.length?`<p class="label">In this story</p>${heads.map(([id,t])=>`<a href="#${id}">${t}</a>`).join("")}<div class="share"><button id="copyLink">Copy link</button></div>`:"";
$("#aside").innerHTML=`<p class="label">Plan your visit</p><h4>Save the places from this story</h4><p>Find every spot in the directory with timings, tips and directions.</p><a class="btn" href="index.html#explore">Open the directory</a>`;
const cl=$("#copyLink");if(cl)cl.onclick=()=>{navigator.clipboard?.writeText(location.href).then(()=>toast("Link copied"),()=>toast("Copy the link from the address bar"))};
if(heads.length&&"IntersectionObserver" in window){const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting)$$("#toc a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+en.target.id))}),{rootMargin:"-30% 0px -60% 0px"});heads.forEach(([id])=>io.observe(document.getElementById(id)))}

const N=POSTS[(idx+1)%POSTS.length];
const nr=$("#nextRead");nr.href=`post.html?p=${N.slug}`;nr.style.setProperty("--h",hue(N.img));
nr.innerHTML=`${ph(N.img,1800,N.t)}<div class="t"><p class="label">Next story</p><h3>${N.t}</h3><p style="color:rgba(255,255,255,.8)">${N.ex}</p><span class="link-more" style="color:#fff">Read it</span></div>`;

$("#more").innerHTML=`<div class="track">${POSTS.filter(p=>p!==P).map(p=>`<a class="post-card" href="post.html?p=${p.slug}">${ph(p.img,900,p.t)}<div><p class="meta"><span class="cat">${p.cat}</span><span>·</span><span>${p.min} min read</span></p><h3 style="margin-top:8px">${p.t}</h3></div></a>`).join("")}</div>${sliderControls()}`;

splitWords($("#atitle"));
Doon.start({onReady(){playSplit($("#atitle"))}});
})();
</script>
</body>
</html>
