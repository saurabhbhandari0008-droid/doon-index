<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Journal · Doon Dekho</title>
<meta name="description" content="Guides, walks, food crawls and stories from Dehradun.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121418'/%3E%3Ctext x='32' y='45' font-family='Arial,sans-serif' font-size='38' font-weight='800' text-anchor='middle' fill='%23C9A86A'%3ED%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#0E1013">
<meta property="og:site_name" content="Doon Dekho">
<meta property="og:type" content="website">
<meta property="og:title" content="Doon Dekho · The complete guide to Dehradun">
<meta property="og:description" content="Cafés, street food, hidden gems, schools, shops and stories from the Doon Valley.">
<meta property="og:image" content="https://images.unsplash.com/photo-1660791601899-f79f14cc427d?auto=format&fit=crop&w=1200&h=630&q=80">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://images.unsplash.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="blog" data-nav="light">
<header id="nav"></header>

<main>
  <section class="page-hero">
    <div class="wrap">
      <p class="label">The Journal</p>
      <h1 id="blogTitle">Stories from <em>the valley.</em></h1>
      <p>Walks, food crawls, school guides and hidden places. Written by people who live in Dehradun.</p>

      <div class="feature-slider" id="fslider" aria-roledescription="carousel" aria-label="Featured stories">
        <div id="fslides"></div>
        <div class="fs-nav"><button id="fPrev" aria-label="Previous story"></button><button id="fNext" aria-label="Next story"></button></div>
      </div>

      <div class="blog-filters">
        <div class="chips" id="bchips" role="group" aria-label="Filter stories"></div>
        <label class="blog-search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="bq" type="search" placeholder="Search stories" aria-label="Search stories"></label>
      </div>
      <div class="blog-grid" id="bgrid"></div>
    </div>
  </section>

  <div class="wrap rv">
    <div class="news">
      <div><p class="label">The Sunday letter</p><h2 style="margin-top:12px">One new Doon find, <em>every week.</em></h2></div>
      <div>
        <form data-news name="newsletter"><input type="hidden" name="form-name" value="newsletter"><input type="email" id="newsEmail" name="email" required placeholder="Your email address" aria-label="Email address"><button type="submit">Subscribe →</button></form>
        <p class="ok" hidden>You’re on the list. See you on Sunday.</p>
      </div>
    </div>
  </div>
</main>
<footer id="footer"></footer>

<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script>
(function(){
const {$,$$,ph,esc,arrowL,arrowR,splitWords,playSplit}=Doon;
$("#fPrev").innerHTML=arrowL;$("#fNext").innerHTML=arrowR;

/* featured slider */
const feat=POSTS.slice(0,4);let fi=0,ft;
$("#fslides").innerHTML=feat.map((p,i)=>`<a class="fs${i?"":" on"}" href="post.html?p=${p.slug}" aria-hidden="${i?"true":"false"}" ${i?'tabindex="-1"':""}>${ph(p.img,1800,p.t,"",i===0)}
  <div class="fs-text"><p class="meta"><span class="cat">${p.cat}</span><span>·</span><span>${p.min} min read</span><span>·</span><span>${p.date}</span></p><h2>${p.t}</h2><p>${p.ex}</p></div></a>`).join("");
function fgo(i){fi=(i+feat.length)%feat.length;$$(".fs").forEach((s,k)=>{s.classList.toggle("on",k===fi);s.setAttribute("aria-hidden",k!==fi);s.tabIndex=k===fi?0:-1});clearTimeout(ft);ft=setTimeout(()=>fgo(fi+1),5000)}
$("#fPrev").onclick=()=>fgo(fi-1);$("#fNext").onclick=()=>fgo(fi+1);
let tx=0;$("#fslider").addEventListener("touchstart",e=>tx=e.touches[0].clientX,{passive:true});
$("#fslider").addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)fgo(fi+(d<0?1:-1))});


/* grid */
const cats=["All",...new Set(POSTS.map(p=>p.cat))];let cat="All",q="";
function chips(){$("#bchips").innerHTML=cats.map(c=>`<button class="chip" data-bc="${c}" aria-pressed="${c===cat}">${c}</button>`).join("")}
function grid(){const l=POSTS.filter(p=>(cat==="All"||p.cat===cat)&&(!q||(p.t+p.ex+p.cat).toLowerCase().includes(q)));
  $("#bgrid").innerHTML=l.length?l.map((p,i)=>`<a class="post-card" href="post.html?p=${p.slug}" style="animation-delay:${i*.07}s">${ph(p.img,i===0?1400:900,p.t)}
   <div><p class="meta"><span class="cat">${p.cat}</span><span>·</span><span>${p.min} min read</span><span>·</span><span>${p.date}</span></p><h3 style="margin-top:10px">${p.t}</h3><p class="ex" style="margin-top:10px">${p.ex}</p></div></a>`).join("")
   :`<div class="empty">No stories match “${esc(q)}”. Try another word.</div>`}
$("#bchips").onclick=e=>{const b=e.target.closest("[data-bc]");if(!b)return;cat=b.dataset.bc;chips();grid()};
$("#bq").oninput=e=>{q=e.target.value.trim().toLowerCase();grid()};
chips();grid();
splitWords($("#blogTitle"));
Doon.start({onReady(){playSplit($("#blogTitle"));fgo(0)}});
})();
</script>
</body>
</html>
